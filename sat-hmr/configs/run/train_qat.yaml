seed: 42
model: default

# ----------------------------------------------------------------
# QAT (Quantization-Aware Training) — W8A8 INT8 via torchao
# ----------------------------------------------------------------
# Start from an FP32/BF16 pretrained checkpoint and fine-tune with
# FakeQuantize (Straight-Through Estimator) for 3 epochs at low LR.
# After training, QAT-adapted FP32 weights are saved as:
#   outputs/ckpts/<exp_name>/qat_fp_weights.pth
# Evaluate with:
#   configs/run/eval_3dpw_torchao_int8.yaml
#   + pretrain=True, pretrain_path=outputs/ckpts/<exp_name>/qat_fp_weights.pth
# ----------------------------------------------------------------

use_qat: true
# torchao 0.6.x: Int8DynActInt4WeightQATQuantizer (W4A8: activation INT8, weight INT4)
# Empty list = quantize every nn.Linear.
qat_skip_modules: ['conf_head', 'bbox_embed', 'pose_head', 'cam_head']

pretrain: True
pretrain_path: 'weights/sat_hmr/sat_644.pth'
resume: False

num_epochs: 3
save_and_eval_epoch: 1
least_eval_epoch: 999
sat_gt_epoch: 0   # don't use GT tokens during QAT fine-tune

# LR: ~1/4 of full training LR (QAT needs careful fine-tuning)
lr: 1.0e-5
lr_encoder_names: ["encoder"]
lr_encoder: 5.0e-6

optimizer: 'adamw'
weight_decay: 0.0001
num_warmup_steps: 100
lr_scheduler: 'cosine'

aux_loss: True
losses: ['confs','poses','betas','boxes','j3ds','j2ds','depths','scale_map']
weight_dict: {'confs':4.,'poses':5.,'betas':3.,'boxes':2., 'giou':2., 'j3ds':8.,'j2ds':40.,'depths':0.5, 'map_confs': 4., 'map_scales': 4.}
detach_j3ds: False

# matcher
set_cost_conf: 1
set_cost_bbox: 1
set_cost_giou: 1
set_cost_kpts: 20

# train aug (same as full training)
aug_cfg:
  rot_range: [-15, 15]
  scale_range: [0.8, 1.8]
  flip_ratio: 0.5

# Dataset: same mix as full training to preserve distribution.
# Replace with your actual dataset list.
train_datasets_used: ['coco']
train_datasets_split: ['train']
train_batch_size: 4
train_num_workers: 8

eval_datasets_used: []
eval_datasets_split: []
eval_vis_num: 20
conf_thresh: [0.5]
eval_batch_size: 12
eval_num_workers: 8
distributed_eval: True
