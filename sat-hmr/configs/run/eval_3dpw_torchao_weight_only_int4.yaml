model: default

pretrain: True
pretrain_path: './weights/sat_hmr/sat_644_3dpw.pth'

torchao_int4: True
# For QAT-saved weights (outputs/ckpts/<exp>/qat_int4_weights.pth):
#   qat_weights: True
#   torchao_int4_skip_modules: ['conf_head','bbox_embed','pose_head','cam_head']
# For plain PTQ (default): leave both unset.
qat_weights: False
torchao_int4_skip_modules: []
dtype_cfg: bfloat16

eval_datasets_used: ['3dpw']
eval_datasets_split: ['test']
eval_vis_num: 20
conf_thresh: [0.3]
eval_batch_size: 12
eval_num_workers: 8
distributed_eval: True
